services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexadesk}
      POSTGRES_USER: ${POSTGRES_USER:-nexadesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexadesk_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nexadesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexadesk} -d ${POSTGRES_DB:-nexadesk}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexadesk-postgres:
